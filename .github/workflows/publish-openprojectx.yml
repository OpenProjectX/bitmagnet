name: Publish OpenProjectX image

on:
  push:
    branches: [main, master, dev, develop]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-openprojectx-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/openprojectx/bitmagnet

jobs:
  publish:
    if: github.repository == 'OpenProjectX/bitmagnet'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
          labels: |
            org.opencontainers.image.source=https://github.com/OpenProjectX/bitmagnet

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE_URL=https://github.com/OpenProjectX/bitmagnet
          cache-from: type=gha,scope=openprojectx-image
          cache-to: type=gha,mode=max,scope=openprojectx-image

      - name: Publish build summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published image'
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
